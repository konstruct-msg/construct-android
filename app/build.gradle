plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.dagger.hilt.android'
    id 'com.google.devtools.ksp'
    id 'com.google.protobuf'
}

// Pinned versions for the protobuf/gRPC codegen toolchain. Keep protoc and the
// grpc-* runtime aligned (grpc-java 1.65.x is built against protobuf 3.25.x).
ext.protobufVersion = '3.25.5'
ext.grpcVersion = '1.65.1'
ext.grpcKotlinVersion = '1.4.1'
ext.roomVersion = '2.8.5'
// iOS pins the same build in `Packages/WebRTC/Package.swift` (webrtc-sdk/Specs 150.7871.01).
ext.webrtcVersion = '150.7871.01'
// The ABIs construct-core is built for — and so the only ones the app ships (`checkCoreLibrary`).
ext.coreAbis = ['arm64-v8a', 'armeabi-v7a', 'x86_64']

android {
    namespace 'com.construct.messenger'
    compileSdk 35

    defaultConfig {
        applicationId "com.construct.messenger"
        minSdk 26
        targetSdk 35
        // Name: bumped by hand — minor for a build handed to testers, patch for a fix build.
        // Code: the commit count, so every build installs over the one before it and nobody
        // has to remember. Sat at 2 / "0.2.0" from April to 2026-09-30 for want of either.
        versionCode commitCount()
        versionName "0.9.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // The ABIs the core is built for. WebRTC also ships x86, where no core exists: without
        // this an x86 device would install the app and fail to start it.
        ndk { abiFilters(*coreAbis) }
    }

    // The release key and its passwords live in ~/.gradle/gradle.properties, never in git
    // (construct-docs client/android/android-sign.md). Without them — another machine, CI —
    // release still builds, unsigned.
    signingConfigs {
        release {
            if (project.hasProperty('KONSTRUCT_STORE_FILE')) {
                storeFile file(KONSTRUCT_STORE_FILE)
                storePassword KONSTRUCT_STORE_PASSWORD
                keyAlias KONSTRUCT_KEY_ALIAS
                keyPassword KONSTRUCT_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            if (project.hasProperty('KONSTRUCT_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    testOptions {
        unitTests {
            // android.util.Log (and other Android stubs) throw "not mocked" by default
            // in JVM unit tests — return defaults instead, no Robolectric needed.
            returnDefaultValues = true
        }
    }
}

dependencies {
    // JNA — required by UniFFI-generated Kotlin bindings (crypto/uniffi/...).
    // The @aar variant bundles the native libjnidispatch.so for Android ABIs.
    implementation 'net.java.dev.jna:jna:5.14.0@aar'
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.1'
    implementation 'androidx.activity:activity-compose:1.8.0'
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.runtime:runtime'
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation 'androidx.datastore:datastore-preferences:1.0.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    // App lock (Settings → Security → PIN). A build-time library, no Play Services on the device.
    implementation 'androidx.biometric:biometric:1.1.0'
    // Ed25519 for the veil access key and capability checks. security-crypto already ships this
    // version at runtime; declared so the code may use it, not to add one.
    implementation 'com.google.crypto.tink:tink-android:1.8.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    // Invite QR: camera preview + frame analysis, and QR read/write. Both work without Google
    // Play Services — ML Kit's scanner is avoided for that reason (AGENTS.md, no GMS).
    // 1.5.x: 1.6 requires compileSdk 36.
    def cameraxVersion = '1.5.3'
    implementation "androidx.camera:camera-camera2:${cameraxVersion}"
    implementation "androidx.camera:camera-lifecycle:${cameraxVersion}"
    implementation "androidx.camera:camera-view:${cameraxVersion}"
    implementation 'com.google.zxing:core:3.5.4'
    // Room — local message/session persistence (data/local/db).
    implementation "androidx.room:room-runtime:${roomVersion}"
    implementation "androidx.room:room-ktx:${roomVersion}"
    ksp "androidx.room:room-compiler:${roomVersion}"
    implementation 'com.google.dagger:hilt-android:2.60.1'
    ksp 'com.google.dagger:hilt-compiler:2.60.1'
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.0'

    // gRPC + protobuf (lite runtime — generated from src/main/proto, see protobuf {} block).
    implementation "io.grpc:grpc-okhttp:${grpcVersion}"
    implementation "io.grpc:grpc-protobuf-lite:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    implementation "io.grpc:grpc-kotlin-stub:${grpcKotlinVersion}"
    implementation "com.google.protobuf:protobuf-kotlin-lite:${protobufVersion}"
    // javax.annotation.Generated, referenced by grpc-java generated stubs.
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'
    implementation 'io.coil-kt:coil-compose:2.6.0'
    // Video: playback from memory (ExoPlayer) and re-encoding before sending (Transformer), as
    // iOS exports at 1080p. AndroidX, build-time only — nothing of Play Services on the device.
    // 1.6.x: later lines require compileSdk 36.
    def media3Version = '1.6.1'
    implementation "androidx.media3:media3-exoplayer:${media3Version}"
    implementation "androidx.media3:media3-ui:${media3Version}"
    implementation "androidx.media3:media3-transformer:${media3Version}"
    implementation "androidx.media3:media3-effect:${media3Version}"
    // Calls (C2): webrtc-sdk's WebRTC, the same line iOS links (`Packages/WebRTC`, 150.7871.01) —
    // frame encryption (`FrameCryptor`, for PQC-4) and the post-quantum DTLS field trial
    // (`calls/WebRtcRuntime`). Plain libwebrtc with Java bindings: no Play Services, no
    // permissions in its manifest. Move both platforms together.
    implementation "io.github.webrtc-sdk:android:${webrtcVersion}"
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.4.0'
    testImplementation "io.grpc:grpc-testing:${grpcVersion}"
    testImplementation 'org.json:json:20231013'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.02.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
// Native libs configuration
android.sourceSets.main.jniLibs.srcDirs = ['src/main/jniLibs']

// ── Protobuf / gRPC codegen ───────────────────────────────────────────────
// Sources live in src/main/proto (vendored from ~/Code/construct-protos).
// Generates Java-lite messages, Kotlin DSL, grpc-java stubs and grpc-kotlin
// coroutine stubs into build/generated/source/proto (not checked in).
protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
        grpckt {
            artifact = "io.grpc:protoc-gen-grpc-kotlin:${grpcKotlinVersion}:jdk8@jar"
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java { option 'lite' }
                kotlin { option 'lite' }
            }
            task.plugins {
                grpc { option 'lite' }
                grpckt { option 'lite' }
            }
        }
    }
}

// ── The core the app is paired with ──────────────────────────────────────────
//
// `libconstruct_core.so` is build output of another repository and is not in git, so nothing in
// a checkout proves which core the Kotlin beside it was generated from. UniFFI does check — it
// compares interface checksums when the library loads — but that check fires at start-up, on a
// device, as a crash with no obvious cause. This one fires before compilation, on the machine
// that can fix it.
//
// The stamp lives inside the library (`CONSTRUCT_CORE_VERSION` in construct-core/src/lib.rs),
// which is what makes it survive being copied into jniLibs with nothing else.
// (coreAbis is set at the top of this file: abiFilters in defaultConfig needs it first.)

/** The NUL-terminated `CONSTRUCT_CORE_VERSION=…` stamp, or null when the file carries none. */
static String coreStampOf(File lib) {
    // ISO-8859-1 maps every byte to the char of the same value, so this is the binary searched
    // as text with nothing lost and nothing re-encoded.
    String text = new String(lib.bytes, 'ISO-8859-1')
    int at = text.indexOf('CONSTRUCT_CORE_VERSION=')
    if (at < 0) return null
    // The release profile packs .rodata literals with no separator, so the NUL the static carries
    // is what makes the value self-delimiting. Reading to the next non-printable character is the
    // same rule `strings` applies, written out.
    int end = at
    while (end < text.length() && text.charAt(end) >= 0x20 && text.charAt(end) < 0x7f) end++
    return text.substring(at, end)
}

tasks.register('checkCoreLibrary') {
    group = 'verification'
    description = 'Refuses to build when jniLibs holds a core other than the one construct-core.lock names.'

    File lock = rootProject.file('construct-core.lock')
    File jniLibs = file('src/main/jniLibs')
    List<File> libs = coreAbis.collect { new File(jniLibs, "$it/libconstruct_core.so") }

    inputs.file(lock)
    // Declared as files rather than as an existing collection: a *missing* library is the
    // commonest failure of all (a fresh clone has none), and a task whose inputs skip it would
    // be up-to-date on the one case it exists to catch.
    inputs.files(libs).withPropertyName('coreLibraries').optional(true)
    outputs.upToDateWhen { false }

    doLast {
        if (!lock.exists()) {
            throw new GradleException("construct-core.lock is missing — nothing records which core this app needs.")
        }
        String expected = lock.readLines()
                .find { it.trim().startsWith('CONSTRUCT_CORE_VERSION=') }
                ?.trim()
        if (!expected) {
            throw new GradleException("construct-core.lock carries no CONSTRUCT_CORE_VERSION line.")
        }

        List<String> problems = []
        coreAbis.eachWithIndex { abi, i ->
            File lib = libs[i]
            if (!lib.exists()) {
                problems << "  $abi: missing"
                return
            }
            String stamp = coreStampOf(lib)
            if (stamp == null) {
                problems << "  $abi: carries no CONSTRUCT_CORE_VERSION stamp — not a construct-core build, or built before 2026-09-04"
            } else if (stamp != expected) {
                // Equality, not a prefix: a stamp that ran into the neighbouring literal still
                // starts with the right thing, and that is exactly what shipped on 2026-09-04.
                problems << "  $abi: $stamp"
            }
        }

        if (problems) {
            throw new GradleException("""
The native core in app/src/main/jniLibs is not the one this app is paired with.

  construct-core.lock expects: $expected
${problems.join('\n')}

Fix it one of two ways:
  • ./build_crypto_lib.sh          — builds from your local construct-core and rewrites the lock
  • download the published build   — https://github.com/konstruct-msg/construct-core/releases/download/latest/construct-core-android.tar.gz
                                     then copy jniLibs/ AND kotlin/uniffi/ from the same archive

Take the .so and the Kotlin bindings from the same build. UniFFI verifies its interface
checksums when the library loads, so a mismatched pair does not fail at the call — the app does
not start, and the reason is not on the screen.
""".stripIndent())
        }
        logger.lifecycle("construct-core: $expected")
    }
}

tasks.named('preBuild').configure { dependsOn 'checkCoreLibrary' }

// ── The WebRTC the app links ─────────────────────────────────────────────────
//
// The field trial that turns on post-quantum DTLS is a string WebRTC reads at start-up; a build
// that renamed or dropped it would fail nowhere and leave calls on X25519 alone. The unit test
// `WebRtcFieldTrialsTest` reads the linked library for the key, as iOS `WebRTCFieldTrialsTests`
// reads its xcframework — so the AAR is handed to the tests.
def webrtcAar = configurations.detachedConfiguration(
        dependencies.create("io.github.webrtc-sdk:android:${webrtcVersion}@aar"))
tasks.withType(Test).configureEach {
    inputs.files(webrtcAar).withPropertyName('webrtcAar')
    doFirst { systemProperty 'webrtc.aar', webrtcAar.singleFile.absolutePath }
}

/** Commits reachable from HEAD; 1 without git or in a shallow clone that cannot count. */
int commitCount() {
    def out = providers.exec {
        commandLine 'git', 'rev-list', '--count', 'HEAD'
        ignoreExitValue = true
    }.standardOutput.asText.get().trim()
    return out.isInteger() ? Math.max(out.toInteger(), 1) : 1
}
