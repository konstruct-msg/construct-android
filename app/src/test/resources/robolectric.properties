# Robolectric installs Conscrypt as the JVM's security provider by default, from its own
# conscrypt-openjdk build. The app ships conscrypt-android (the veil-front TLS dialer, #75), whose
# classes win on the test classpath and load `conscrypt_jni` — an Android library the host does
# not have — so every Robolectric test failed before running. No unit test needs Conscrypt.
conscryptMode=OFF
