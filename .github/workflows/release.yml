# A signed release APK: on a tag v<versionName>, or by hand.
#
# The keystore comes from the KONSTRUCT_STORE_FILE secret (base64) and is written to the runner's
# temp directory only; the passwords and alias go to Gradle as project properties through the
# environment, never on a command line. The APK is checked against the pinned signing
# certificate before anything is published: without the properties app/build.gradle builds an
# unsigned release without a word, and an APK signed by another key cannot update the app
# testers have — Android refuses it, and reinstalling loses their data.
#
# A tag makes a draft GitHub release with the APK; publishing it is a person's decision.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # SHA-256 of the certificate every build handed to testers is signed with.
  SIGNER_SHA256: 9038244a0681f0f51dc972a8cb5bd4f436246738557e3fe2f952f1ae1e3604ec

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The runner image carries the Android SDK (ANDROID_HOME) with its licences accepted; AGP
      # fetches a missing platform itself. android-actions/setup-android@v3 failed asking
      # sdkmanager for the removed 'tools' package (2026-10-04).

      - uses: gradle/actions/setup-gradle@v4

      - name: Core from the lock
        run: scripts/fetch_core.sh

      - name: Version
        id: version
        run: |
          name=$(sed -nE 's/^ *versionName "([^"]+)".*/\1/p' app/build.gradle | head -1)
          code=$(git rev-list --count HEAD)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$name" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match versionName $name"
            exit 1
          fi

      - name: Verify
        # Compile, tests and the static checks; the commit range is not this job's question.
        run: scripts/verify.sh --since HEAD

      - name: Keystore
        env:
          STORE_B64: ${{ secrets.KONSTRUCT_STORE_FILE }}
        run: |
          [ -n "$STORE_B64" ] || { echo "::error::KONSTRUCT_STORE_FILE is not set"; exit 1; }
          printf '%s' "$STORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"

      - name: Assemble
        env:
          ORG_GRADLE_PROJECT_KONSTRUCT_STORE_FILE: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_KONSTRUCT_STORE_PASSWORD: ${{ secrets.KONSTRUCT_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_KONSTRUCT_KEY_ALIAS: ${{ secrets.KONSTRUCT_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_KONSTRUCT_KEY_PASSWORD: ${{ secrets.KONSTRUCT_KEY_PASSWORD }}
        run: ./gradlew --console=plain :app:assembleRelease

      - name: Drop the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Signer is the pinned one
        id: apk
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          [ -f "$apk" ] || { echo "::error::no app-release.apk (unsigned builds are named app-release-unsigned.apk)"; exit 1; }
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          # Every signer the APK names, whatever this apksigner calls it ("Signer #1", or by its
          # SDK range in newer build-tools); exactly one, and the pinned one.
          certs=$("$apksigner" verify --verbose --print-certs "$apk")
          echo "$certs" | grep -E 'Verified using|SHA-256 digest' || true
          got=$(echo "$certs" | sed -nE 's/^Signer.* certificate SHA-256 digest: ([0-9a-f]+)$/\1/p' | sort -u)
          if [ "$got" != "$SIGNER_SHA256" ]; then
            echo "::error::signed by ${got:-nothing}, expected $SIGNER_SHA256"
            exit 1
          fi
          out="konstruct-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}.apk"
          cp "$apk" "$out"
          sha256sum "$out" | tee "$out.sha256"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256
          retention-days: 30

      - name: Draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.apk.outputs.file }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$FILE" "$FILE.sha256" \
            --draft --title "$GITHUB_REF_NAME" \
            --notes "Signed APK, versionCode ${{ steps.version.outputs.code }}, signer SHA-256 $SIGNER_SHA256."
